# Same model and settings as the laptop baseline (configs/baseline.yaml), run on the college GPU.
# Purpose: compare the same 1B model on two GPUs (RTX 5060 Laptop 8 GB vs the 48 GB server card).
# run_server.sh runs this only if time is left after the 3B baseline.
run_name: server_1b
model: unsloth/Llama-3.2-1B-Instruct
revision: null
fallback_models: []
dtype: float16
attn: sdpa
attn_patch: true
vram_fraction: 0.90
device: cuda
seed: 0
model_check: false          # the 3B run already checked the GPU; just verify the model is reachable

sweep:
  contexts: [1024, 2048, 4096, 8192, 16384]
  batches: [1, 2, 4, 8]
  decode_tokens: 32
  trials: 3
  max_minutes: 10

bandwidth:
  size_mb: 2048
  iters: 20

needle:
  contexts: [1024, 2048, 4096, 8192, 16384]
  depths: [0.0, 0.25, 0.5, 0.75, 1.0]
  samples: 4                # laptop already established 100%; a few rounds suffice here
  max_new_tokens: 20
  max_minutes: 5

ppl:
  lengths: [2048, 4096]
  segments: 8
  chunk: 256
  bos: false                # identical to the laptop run, so the numbers are directly comparable
  max_minutes: 3

quick:
  sweep: {contexts: [1024, 2048], batches: [1, 2], decode_tokens: 8, trials: 1, max_minutes: 2}
  bandwidth: {size_mb: 256, iters: 5}
  needle: {contexts: [1024, 2048], depths: [0.0, 1.0], samples: 1, max_new_tokens: 20, max_minutes: 2}
  ppl: {lengths: [1024], segments: 1, chunk: 256, max_minutes: 1}
